services:
  app:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    container_name: cbes_app
    working_dir: /var/www/html
    ports:
      - "8080:80"
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - composer_cache:/tmp/composer-cache
      - npm_cache:/home/www-data/.npm
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      CHROME_BIN: /usr/bin/chromium
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_DOWNLOAD: "true"
      VITE_HOST: 0.0.0.0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:9.7
    container_name: cbes_mysql
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-time-zone=+00:00"
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: digital_sports_crm
      MYSQL_USER: cbes
      MYSQL_PASSWORD: cbes
    volumes:
      - mysql_data:/var/lib/mysql
      - ./.docker/mysql/my.cnf:/etc/mysql/conf.d/zz-cbes.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: cbes_redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: cbes_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  queue:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    container_name: cbes_queue
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --sleep=1
    volumes:
      - ./:/var/www/html
      - composer_cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      CHROME_BIN: /usr/bin/chromium
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_DOWNLOAD: "true"
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - workers

  scheduler:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    container_name: cbes_scheduler
    working_dir: /var/www/html
    command: sh -lc 'while true; do php artisan schedule:run --no-interaction; sleep 60; done'
    volumes:
      - ./:/var/www/html
      - composer_cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      CHROME_BIN: /usr/bin/chromium
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_DOWNLOAD: "true"
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - workers

volumes:
  mysql_data:
  composer_cache:
  npm_cache:
